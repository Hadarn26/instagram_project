name: Deploy to GHCR

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}:${{ inputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./Dockerfile
          args: |
            AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}
            AZURE_REDIRECT_URI=${{ vars.AZURE_REDIRECT_URI }}
            AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}
            AZURE_SCOPES=${{ vars.AZURE_SCOPES }}
            SERVER_BASE_URL=${{ vars.SERVER_BASE_URL }}

  deploy-aws:
    needs: build
    runs-on: [self-hosted, aws, ec2runner, "${{ vars.RUNNER_TAG }}"]

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-duration-seconds: 3600

      - name: Rollout deployment restart
        run: |
          kubectl rollout restart deployment ${{ vars.K8S_DEPLOYMENT }} --namespace ${{ vars.K8S_NAMESPACE }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
