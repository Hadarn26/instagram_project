services:
  web:
    build:
      context: .
      args:
        - NODE_ENV=production
        - AZURE_CLIENT_ID=${VITE_AZURE_CLIENT_ID}
        - AZURE_REDIRECT_URI=${VITE_AZURE_REDIRECT_URI}
        - AZURE_TENANT_ID=${VITE_AZURE_TENANT_ID}
        - AZURE_SCOPES=${VITE_AZURE_SCOPES}
        - SERVER_BASE_URL=${VITE_SERVER_BASE_URL}
    ports:
      - "3000:3000"
